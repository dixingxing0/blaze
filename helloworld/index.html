<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at top, #1d4ed8 0%, transparent 45%),
          var(--bg);
        color: var(--text);
      }

      main {
        width: min(92vw, 520px);
        padding: 40px 32px;
        border-radius: 20px;
        background: color-mix(in srgb, var(--card) 88%, transparent);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.35);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: 0.04em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .accent {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello <span class="accent">World</span></h1>
      <p>这是一个静态页面。</p>
    </main>
  </body>
</html>
