name: Auron Full Build

on:
  push:
    branches:
      - 'ci/full-build/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-build:
    name: Spark 3.5 / Scala 2.12 compile
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout Auron
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: adopt-hotspot
          java-version: '17'
          cache: maven

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '21.7'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          rustflags: --allow warnings -C target-feature=+aes
          components:
            cargo

      - name: Setup vendors
        run: dev/vendors/setup-vendors.sh

      - name: Use pinned ORC Cargo.lock
        run: cp dev/vendors/patches/orc-rust/Cargo.lock dev/vendors/packages/orc-rust/Cargo.lock

      - name: Test ORC string statistics pruning
        working-directory: dev/vendors/packages/orc-rust
        run: cargo test --locked --lib string_

      - name: Check ORC stats CLI
        working-directory: dev/vendors/packages/orc-rust
        run: cargo check --locked --features cli --bin orc-stats

      - name: Build Auron
        run: ./auron-build.sh --pre --sparkver 3.5 --scalaver 2.12 --skiptests true
